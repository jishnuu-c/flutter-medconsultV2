name: medconsult_qa
description: "Flutter QA application mirroring Angular medConsultV2 functionality"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  web_socket_channel: ^3.0.0
  file_picker: ^11.0.2
  flutter_svg: ^2.0.9
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  http_parser: ^4.0.2
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/logo.png
    - lib/assets/icons/google.svg